name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format .
          git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate package publication
        run: dart pub publish --dry-run
